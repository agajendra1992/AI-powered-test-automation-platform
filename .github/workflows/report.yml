# Reusable: merge every shard's/browser's Allure results from this run into one report.
name: Build report

on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    name: Allure report and summary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true

      - name: Download execution summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: summary-*
          path: summaries

      - name: Combined summary
        run: python3 scripts/ci_summary.py summaries/*/execution-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Allure report
        run: |
          if [[ -z "$(ls -A target/allure-results 2>/dev/null)" ]]; then
            echo "::warning::No Allure results were produced; skipping the report."
            exit 0
          fi
          scripts/allure-report.sh

      - name: Upload Allure report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
