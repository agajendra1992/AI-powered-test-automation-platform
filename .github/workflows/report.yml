# Reusable: merge every shard's/browser's Allure results from this run into one report, and add the
# run to the execution history (last 1/3/7/10/30 days, weekly, monthly; docs/EXECUTION_HISTORY.md).
name: Build report

on:
  workflow_call:
    inputs:
      title:
        description: Name used in notifications, e.g. "Nightly regression"
        type: string
        default: Test run
    # All optional: without them notifications and the test-management export are skipped (dry run).
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false
      XRAY_CLIENT_ID:
        required: false
      XRAY_CLIENT_SECRET:
        required: false
      TESTRAIL_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  report:
    name: Allure report and summary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HISTORY_DIR: .qa-history
      # Days, weeks and months in the report follow this zone (repository variable HISTORY_TZ to change it).
      HISTORY_TZ: ${{ vars.HISTORY_TZ || 'Asia/Kolkata' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true

      - name: Download execution summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: summary-*
          path: summaries

      - name: Download Cucumber JSON
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cucumber-json-*
          path: cucumber-json

      - name: Combined summary
        run: python3 scripts/ci_summary.py summaries/*/execution-summary.json >> "$GITHUB_STEP_SUMMARY"

      # ---- Execution history -----------------------------------------------------------------
      # The history (earlier runs + Allure trend data) lives in the Actions cache, one chain per
      # workflow: each run restores the newest copy and saves a new one. Unused caches expire after
      # 7 days, so a workflow that pauses longer starts a new history; the artifact below keeps a copy.
      - name: Restore execution history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .qa-history
          key: execution-history-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: execution-history-${{ github.workflow }}-

      - name: Record this run in the history
        env:
          RUN_LABEL: "${{ inputs.title }} #${{ github.run_number }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          summaries=(summaries/*/execution-summary.json)
          if (( ${#summaries[@]} )); then
            python3 scripts/execution_history.py record "${summaries[@]}" --label "$RUN_LABEL" --run-url "$RUN_URL"
          else
            echo "::warning::No execution summaries; this run is not in the history."
          fi

      - name: Generate Allure report
        run: |
          if [[ -z "$(ls -A target/allure-results 2>/dev/null)" ]]; then
            echo "::warning::No Allure results were produced; skipping the report."
            exit 0
          fi
          scripts/allure-report.sh

      - name: Upload Allure report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Execution history report
        if: always()
        run: |
          python3 scripts/execution_history.py report
          python3 scripts/execution_history.py table >> "$GITHUB_STEP_SUMMARY"

      - name: Upload execution history report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-history
          path: |
            target/execution-history
            .qa-history/runs
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Save execution history
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .qa-history
          key: execution-history-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ---- Integrations (each is a no-op until its secrets/variables are set) ----------------
      # Results are sent as produced: failures stay failures. A failed delivery warns but never fails the report.
      - name: Export results to test management (Xray / TestRail)
        if: always()
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_BASE_URL: ${{ vars.XRAY_BASE_URL }}
          TESTRAIL_URL: ${{ vars.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ vars.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_RUN_ID: ${{ vars.TESTRAIL_RUN_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          reports=(cucumber-json/*/*.json)
          python3 scripts/testmgmt_export.py xray "${reports[@]}"
          python3 scripts/testmgmt_export.py testrail "${reports[@]}"

      - name: Notify Slack / Teams
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_TITLE: ${{ inputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          python3 scripts/notify.py summaries/*/execution-summary.json
