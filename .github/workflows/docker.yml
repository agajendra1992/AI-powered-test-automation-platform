# Builds both images and runs the smoke suite inside Docker whenever the container setup changes.
name: Docker

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, docker-compose.yml, 'sut/**', pom.xml, .github/workflows/docker.yml]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, docker-compose.yml, 'sut/**', pom.xml, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Build images, smoke in Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: docker compose --profile tests build

      - name: Start the demo app
        run: docker compose up -d --wait sut

      - name: Smoke suite in the test container
        # target/ must exist and belong to the runner user (uid 1001 = pwuser in the image).
        run: |
          mkdir -p target
          docker compose run --rm tests

      - name: Job summary
        if: always()
        run: python3 scripts/ci_summary.py target/execution-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Demo app logs
        if: failure()
        run: docker compose logs sut

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-smoke-results
          path: |
            target/allure-results
            target/test-failures
            target/execution-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down
