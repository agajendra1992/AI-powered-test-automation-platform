# QA environment. Credentials are NOT stored here: provide AUTH_USERNAME / AUTH_PASSWORD /
# OAUTH_CLIENT_SECRET as environment variables (GitHub Secrets in CI).
base.url=https://qa.example.com
api.base.url=https://qa-api.example.com
oauth.token.url=https://qa-api.example.com/api/oauth/token
oauth.client.id=qa-client
retry.count=1
trace.mode=on-first-retry
