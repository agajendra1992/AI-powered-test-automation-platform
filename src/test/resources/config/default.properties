# Shared defaults for every environment. Override per env in <env>.properties,
# per run with -Dkey=value, or via env vars (KEY_NAME). Never put real secrets here.
browser=chromium
headless=true
viewport.width=1440
viewport.height=900
locale=en-US
timeout.default.ms=10000
timeout.navigation.ms=30000
api.timeout.ms=20000
# off | on | retain-on-failure | on-first-retry
trace.mode=retain-on-failure
video.enabled=false
video.keep.on.pass=false
retry.count=0
ui.dialog.policy=accept
ui.auth.storage.key=authToken
api.max.response.ms=2000
# Accessibility (axe-core). Tags: WCAG 2.0 + 2.1, levels A and AA. Fail on serious/critical; minor and
# moderate are reported only. Disabled rules need a written reason in docs/ACCESSIBILITY.md.
a11y.tags=wcag2a,wcag2aa,wcag21a,wcag21aa
a11y.fail.impact=serious
a11y.disabled.rules=
# Visual regression. Baselines per <browser>-<os>; write them only with -Dvisual.update=true.
visual.baseline.dir=src/test/resources/visual-baselines
visual.max.diff.ratio=0.001
visual.channel.tolerance=24
visual.update=false
