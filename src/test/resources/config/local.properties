# Bundled demo application (sut/), started with: sut/.venv/bin/uvicorn app:app --app-dir sut --port 8000
base.url=http://localhost:8000
api.base.url=http://localhost:8000
auth.username=qa.admin
# Local demo credential only (matches the SUT default). Real environments supply AUTH_PASSWORD from secrets.
auth.password=local-demo-only
oauth.token.url=http://localhost:8000/api/oauth/token
oauth.client.id=qa-client
oauth.client.secret=local-demo-client-secret
